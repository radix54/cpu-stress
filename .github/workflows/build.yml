name: Compilation

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build_linux:

    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout
      uses: actions/checkout@v7
    
    - name: Install Intel C Compiler
      run: |
        sudo apt update
        sudo apt install -y gnupg wget
        wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt update
        sudo apt install -y intel-oneapi-compiler-dpcpp-cpp

    - name: Setup Environment
      run: source /opt/intel/oneapi/setvars.sh
    
    - name: Compile
      run: make
        
    - name: Export Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: cpu_stress-linux
        path: bin/*

    - name: Attach executable to release
      run: |
        cp bin/cpu_stress bin/cpu_stress-linux
        gh release upload "${{ github.event.release.tag_name }}" bin/cpu_stress-linux --clobber
      env:
        GH_TOKEN: ${{ github.token }}

  build_windows:
    runs-on: windows-latest

    steps:
    
    - name: Checkout
      uses: actions/checkout@v7
      
    - name: Install Intel C Compiler
      run: |
        choco install intel-oneapi-compiler-dpcpp-cpp
    
    - name: Setup Environment
      run: call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
    
    - name: Compile
      run: make
    
    - name: Export Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: cpu_stress-windows
        path: bin\*

    - name: Attach executable to release
      shell: pwsh
      run: |
        $executable = Get-ChildItem bin\cpu_stress* -File |
          Where-Object { $_.Name -notlike '*-windows.exe' } |
          Select-Object -First 1
        if ($null -eq $executable) {
          throw 'The Windows executable was not produced.'
        }
        Copy-Item $executable.FullName bin\cpu_stress-windows.exe
        gh release upload "${{ github.event.release.tag_name }}" bin\cpu_stress-windows.exe --clobber
      env:
        GH_TOKEN: ${{ github.token }}
